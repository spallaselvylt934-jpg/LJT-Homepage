name: Validate personal homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Verify saved profile and page scope
        run: |
          python3 - <<'PY'
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import json

          root = Path('_site')
          expected = {'index.html', 'publications/index.html'}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*.html')}
          assert actual == expected, f'Unexpected HTML pages: {sorted(actual ^ expected)}'
          titles = [
              'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
              'On the Perception Bottleneck of VLMs for Chart Understanding',
              'On the Universal Truthfulness Hyperplane Inside LLMs',
              'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
              'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
              'Composing Parameter-Efficient Modules with Arithmetic Operations',
          ]
          placeholders = ['Your Name', 'Your Sidebar Name', 'Red Brick University', 'none@example.org']
          host = 'spallaselvylt934-jpg.github.io'
          prefix = '/LJT-Homepage/'

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  self.urls.extend(value for key, value in attrs if key in ('href', 'src') and value)

          for filename in sorted(expected):
              content = unescape((root / filename).read_text())
              assert 'Junteng Liu' in content, filename
              assert all(title in content for title in titles), f'Missing publication in {filename}'
              assert not any(text in content for text in placeholders), f'Template placeholder in {filename}'
              assert 'mailto:jliugi@connect.ust.hk' in content, filename
              assert 'https://github.com/Vicent0205' in content, filename
              assert 'tbK9jl4AAAAJ' in content, filename
              assert 'https://x.com/junteng88716710' in content, filename
              links = Links()
              links.feed(content)
              for url in links.urls:
                  parsed = urlsplit(url)
                  if parsed.netloc and parsed.netloc != host:
                      continue
                  if parsed.scheme and parsed.scheme not in ('http', 'https'):
                      continue
                  if not parsed.path:
                      continue
                  assert parsed.path.startswith(prefix), f'Incorrect project path: {url}'
                  target = root / parsed.path[len(prefix):]
                  if parsed.path.endswith('/'):
                      target = target / 'index.html'
                  assert target.exists(), f'Missing internal target: {url}'
              print(f'PASS: {filename}: six saved publications, correct contacts, valid internal links')

          homepage = (root / 'index.html').read_text()
          for anchor in ['education', 'research-interests', 'research-experience', 'publications', 'skills', 'awards', 'contact']:
              assert f'id="{anchor}"' in homepage, f'Missing About section: {anchor}'
          manifest = json.loads((root / 'images/manifest.json').read_text())
          assert manifest['name'] == 'Junteng Liu'
          assert manifest['start_url'] == prefix
          print('PASS: only About and Publications HTML pages; all requested About sections present')
          PY
